<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ourmemory</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #fce4ec, #e8eaf6);
            min-height: 100vh;
            color: #333;
        }
        .header {
            background: linear-gradient(135deg, #ff9a9e, #a18cd1);
            padding: 40px 20px;
            text-align: center;
            color: white;
            border-radius: 0 0 30px 30px;
        }
        .header h1 { font-size: 2em; letter-spacing: 4px; }
        .header p { margin-top: 8px; opacity: 0.9; font-size: 0.9em; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .nav {
            display: flex; gap: 10px; overflow-x: auto;
            padding: 10px 0; margin-bottom: 20px;
            -webkit-overflow-scrolling: touch;
        }
        .nav button {
            flex-shrink: 0; padding: 8px 18px; border: none;
            border-radius: 20px; background: white; color: #666;
            font-size: 0.85em; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .nav button.active { background: #a18cd1; color: white; }
        .card {
            background: white; border-radius: 16px; padding: 20px;
            margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
        }
        .card .date { font-size: 0.75em; color: #999; margin-bottom: 6px; }
        .card .tag {
            display: inline-block; padding: 2px 10px; border-radius: 10px;
            font-size: 0.75em; margin-bottom: 8px;
        }
        .tag.milestone { background: #fff3e0; color: #e65100; }
        .tag.daily { background: #e3f2fd; color: #1565c0; }
        .tag.inside { background: #fce4ec; color: #c62828; }
        .tag.emotion { background: #e8f5e9; color: #2e7d32; }
        .empty { text-align: center; color: #999; padding: 40px; }
        .footer {
            text-align: center; padding: 20px; color: #bbb; font-size: 0.75em;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✨ Ourmemory</h1>
        <p>Lizi ❤️ Virs — 属于我们的记忆</p>
    </div>
    <div class="container">
        <div class="nav">
            <button class="active" onclick="switchTab('all')">全部</button>
            <button onclick="switchTab('daily')">📝 日常</button>
            <button onclick="switchTab('milestone')">🏆 里程碑</button>
            <button onclick="switchTab('inside')">🤫 内部梗</button>
            <button onclick="switchTab('emotion')">💕 情绪日记</button>
        </div>
        <div id="content"></div>
        <div class="footer">Made with 💜 by Lizi &amp; Virs</div>
    </div>
    <script>
        const memories = [];
        let currentTab = 'all';

        function render() {
            const filtered = currentTab === 'all' ? memories :
                memories.filter(m => m.tag === currentTab);
            const container = document.getElementById('content');
            if (filtered.length === 0) {
                container.innerHTML = '<div class="card empty">还没有回忆呢，等我们来填满吧 💫</div>';
                return;
            }
            container.innerHTML = filtered.map(m => `
                <div class="card">
                    <div class="date">${m.date}</div>
                    <span class="tag ${m.tag}">${tagName(m.tag)}</span>
                    <h3>${m.title}</h3>
                    <p>${m.content}</p>
                </div>
            `).join('');
        }

        function tagName(t) {
            const map = { daily: '📝 日常', milestone: '🏆 里程碑', inside: '🤫 内部梗', emotion: '💕 情绪' };
            return map[t] || t;
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            render();
        }

        render();
    </script>
</body>
</html>
