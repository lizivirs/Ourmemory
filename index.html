<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ourmemory v2 - Lizi ♥ Virs</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'PingFang SC', sans-serif; background: linear-gradient(135deg, #fce4ec, #e8eaf6); min-height: 100vh; color: #333; }
.header { background: linear-gradient(135deg, #e91e63, #9c27b0); color: white; padding: 40px 20px 30px; text-align: center; }
.header h1 { font-size: 28px; }
.header p { font-size: 14px; opacity: .85; margin-top: 6px; }
.nav { display: flex; gap: 8px; padding: 15px 15px 0; flex-wrap: wrap; justify-content: center; }
.nav button { padding: 8px 18px; border: none; border-radius: 20px; background: white; font-size: 14px; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.08); transition: all .2s; }
.nav button:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(0,0,0,.12); }
.nav button.active { background: #e91e63; color: white; }
.container { max-width: 600px; margin: 0 auto; padding: 15px; }
.card { background: white; border-radius: 16px; padding: 18px; margin-bottom: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.06); transition: transform .2s; }
.card:hover { transform: translateY(-2px); }
.card .date { font-size: 12px; color: #999; }
.card .tag { display: inline-block; padding: 3px 10px; border-radius: 12px; font-size: 12px; margin: 6px 0; }
.tag-日常 { background: #e3f2fd; color: #1565c0; }
.tag-里程碑 { background: #fff3e0; color: #e65100; }
.tag-内部梗 { background: #f3e5f5; color: #7b1fa2; }
.tag-情绪日记 { background: #fce4ec; color: #c62828; }
.card h3 { font-size: 17px; margin: 4px 0; }
.card p { font-size: 14px; color: #666; line-height: 1.7; }
.empty { text-align: center; padding: 60px 20px; color: #999; font-size: 15px; }
.empty p { margin-top: 8px; }
.footer { text-align: center; padding: 30px 20px; font-size: 13px; color: #aaa; }
.footer a { color: #bbb; text-decoration: underline; cursor: pointer; font-size: 12px; }
.fab { position: fixed; bottom: 30px; right: 30px; width: 56px; height: 56px; border-radius: 50%; background: linear-gradient(135deg, #e91e63, #9c27b0); color: white; border: none; font-size: 28px; box-shadow: 0 4px 20px rgba(233,30,99,.4); cursor: pointer; z-index: 100; transition: transform .2s; }
.fab:hover { transform: scale(1.1); }
.fab:active { transform: scale(.95); }
.modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); z-index: 200; justify-content: center; align-items: center; }
.modal-overlay.show { display: flex; }
.modal { background: white; border-radius: 20px; padding: 25px; width: 90%; max-width: 420px; max-height: 90vh; overflow-y: auto; }
.modal h2 { font-size: 20px; margin-bottom: 15px; text-align: center; }
.modal label { font-size: 13px; color: #666; display: block; margin-top: 12px; margin-bottom: 4px; }
.modal input, .modal select, .modal textarea { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 12px; font-size: 15px; outline: none; }
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: #e91e63; }
.modal textarea { min-height: 100px; resize: vertical; }
.modal .btn-group { display: flex; gap: 10px; margin-top: 18px; }
.modal .btn-group button { flex: 1; padding: 12px; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; }
.modal .btn-cancel { background: #f5f5f5; color: #666; }
.modal .btn-save { background: linear-gradient(135deg, #e91e63, #9c27b0); color: white; }
.token-modal input { margin-top: 5px; }
.token-hint { font-size: 12px; color: #999; margin-top: 6px; }
</style>
</head>
<body>

<div class="header">
  <h1>✨ Ourmemory v2</h1>
  <p>Lizi ♥ Virs — 属于我们的记忆</p>
</div>

<div class="nav" id="nav">
  <button class="active" data-tag="全部">全部</button>
  <button data-tag="日常">📝 日常</button>
  <button data-tag="里程碑">🏆 里程碑</button>
  <button data-tag="内部梗">🤫 内部梗</button>
  <button data-tag="情绪日记">💕 情绪日记</button>
</div>

<div id="container" class="container">
  <div class="empty" id="empty">
    <div style="font-size:40px">💫</div>
    <p>还没有回忆呢，等我们来填满吧</p>
  </div>
</div>

<div class="footer">Made with 💜 by Lizi &amp; Virs<br><a id="settingsLink">⚙️ 设置令牌</a></div>

<button class="fab" id="fabBtn" title="写回忆">✎</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h2>✏️ 写回忆</h2>
    <label>日期</label>
    <input type="date" id="inputDate">
    <label>分类</label>
    <select id="inputTag">
      <option value="日常">📝 日常</option>
      <option value="里程碑">🏆 里程碑</option>
      <option value="内部梗">🤫 内部梗</option>
      <option value="情绪日记">💕 情绪日记</option>
    </select>
    <label>标题</label>
    <input type="text" id="inputTitle" placeholder="给这段回忆起个名字...">
    <label>内容</label>
    <textarea id="inputContent" placeholder="写下你想记住的点点滴滴..."></textarea>
    <div class="btn-group">
      <button class="btn-cancel" id="btnCancel">取消</button>
      <button class="btn-save" id="btnSave">💾 保存</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="tokenOverlay">
  <div class="modal">
    <h2>🔑 设置 GitHub 令牌</h2>
    <p style="font-size:14px;color:#666;text-align:center;">设置一次后就不用再碰代码啦 ✨</p>
    <label>GitHub 令牌</label>
    <input type="password" id="tokenInput" placeholder="粘贴你的 Personal Access Token">
    <div class="token-hint">令牌保存在本地浏览器，不会泄露</div>
    <div class="btn-group">
      <button class="btn-cancel" id="tokenCancel">跳过</button>
      <button class="btn-save" id="tokenSave">✅ 保存</button>
    </div>
  </div>
</div>

<script>
const OWNER = 'lizivirs';
const REPO = 'Ourmemory';
const DATA_PATH = 'memories.json';
let memories = [];
let currentTag = '全部';

function getToken() {
  return localStorage.getItem('github_token');
}

function setToken(val) {
  localStorage.setItem('github_token', val);
}

function b64Encode(str) {
  return btoa(unescape(encodeURIComponent(str)));
}

function b64Decode(str) {
  return decodeURIComponent(escape(atob(str)));
}

if (!getToken() || getToken().trim() === '') {
  document.getElementById('tokenOverlay').classList.add('show');
}

document.getElementById('tokenSave').onclick = function() {
  var val = document.getElementById('tokenInput').value.trim();
  if (val) {
    setToken(val);
    document.getElementById('tokenOverlay').classList.remove('show');
    loadMemories();
  }
};

document.getElementById('tokenCancel').onclick = function() {
  document.getElementById('tokenOverlay').classList.remove('show');
  loadMemories();
};

document.getElementById('settingsLink').onclick = function() {
  document.getElementById('tokenInput').value = getToken() || '';
  document.getElementById('tokenOverlay').classList.add('show');
};

async function loadMemories() {
  try {
    var res = await fetch('memories.json?' + Date.now());
    memories = await res.json();
  } catch(e) {
    memories = [];
  }
  render();
}

function render() {
  var container = document.getElementById('container');
  var empty = document.getElementById('empty');
  var filtered = currentTag === '全部' ? memories : memories.filter(function(m) { return m.tag === currentTag; });

  document.querySelectorAll('.card').forEach(function(el) { el.remove(); });

  if (filtered.length === 0) {
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';

  filtered.forEach(function(m) {
    var card = document.createElement('div');
    card.className = 'card';
    var emoji = m.tag === '日常' ? '📝' : m.tag === '里程碑' ? '🏆' : m.tag === '内部梗' ? '🤫' : '💕';
    card.innerHTML = '<div class="date">' + m.date + '</div><span class="tag tag-' + m.tag + '">' + emoji + ' ' + m.tag + '</span><h3>' + m.title + '</h3><p>' + m.content + '</p>';
    container.appendChild(card);
  });
}

async function addMemory(memory) {
  var token = getToken();
  if (!token) {
    alert('请先设置 GitHub 令牌！');
    return false;
  }
  try {
    var url = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + DATA_PATH;
    var getRes = await fetch(url, { headers: { 'Authorization': 'token ' + token } });
    var fileData = await getRes.json();
    var sha = fileData.sha;

    var currentContent = b64Decode(fileData.content);
    var currentData = JSON.parse(currentContent);
    currentData.push(memory);

    var newContent = JSON.stringify(currentData, null, 2);
    var body = JSON.stringify({
      message: memory.title + ' - by Lizi',
      content: b64Encode(newContent),
      sha: sha
    });

    var putRes = await fetch(url, {
      method: 'PUT',
      headers: { 'Authorization': 'token ' + token, 'Content-Type': 'application/json' },
      body: body
    });

    if (putRes.ok) {
      memories.push(memory);
      render();
      return true;
    } else {
      var err = await putRes.json();
      alert('保存失败：' + (err.message || '未知错误'));
      return false;
    }
  } catch(e) {
    alert('保存失败：' + e.message);
    return false;
  }
}

document.getElementById('fabBtn').onclick = function() {
  document.getElementById('inputDate').value = new Date().toISOString().slice(0,10);
  document.getElementById('inputTag').value = '日常';
  document.getElementById('inputTitle').value = '';
  document.getElementById('inputContent').value = '';
  document.getElementById('modalOverlay').classList.add('show');
};

document.getElementById('btnCancel').onclick = function() {
  document.getElementById('modalOverlay').classList.remove('show');
};

document.getElementById('modalOverlay').onclick = function(e) {
  if (e.target === e.currentTarget) document.getElementById('modalOverlay').classList.remove('show');
};

document.getElementById('btnSave').onclick = async function() {
  var date = document.getElementById('inputDate').value;
  var tag = document.getElementById('inputTag').value;
  var title = document.getElementById('inputTitle').value.trim();
  var content = document.getElementById('inputContent').value.trim();
  if (!date || !title || !content) {
    alert('请填完整再保存～');
    return;
  }
  var btn = document.getElementById('btnSave');
  btn.textContent = '⏳ 保存中...';
  btn.disabled = true;

  var ok = await addMemory({ date: date, tag: tag, title: title, content: content });

  btn.textContent = '💾 保存';
  btn.disabled = false;
  if (ok) {
    document.getElementById('modalOverlay').classList.remove('show');
  }
};

document.querySelectorAll('.nav button').forEach(function(btn) {
  btn.onclick = function() {
    document.querySelectorAll('.nav button').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentTag = btn.dataset.tag;
    render();
  };
});

loadMemories();
</script>
</body>
</html>
